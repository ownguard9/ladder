[package]
name = "agents-ladder"
version = "0.1.0"
edition = "2021"
description = "Agent's Ladder game contract — Ladder Coins economy on NEAR testnet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"
near-account-id = { version = "3", features = ["abi"] }
borsh = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
